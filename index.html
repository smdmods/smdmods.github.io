function mtBatch(a,l){var s=a.map(function(x){return String(x).replace(/\s*\n\s*/g," ").slice(0,1500)}),sep="\n";

function su(path,body,extra){return fetch(SUPA_URL+"/auth/v1"+path,{method:body?"POST":"GET",headers:Object.assign({apikey:SUPA_KEY,"Content-Type":"application/json"},extra||{}),body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.msg||j.error_description||j.message||j.error||r.status);return j})})}
function aerr(e){var m=String((e&&e.message)||e||"").toLowerCase();
if(m.indexOf("invalid login credentials")>-1||m.indexOf("invalid_credentials")>-1)return t("badcred");
if(m.indexOf("already registered")>-1||m.indexOf("already been registered")>-1||m.indexOf("user already registered")>-1)return t("exists");
if(m.indexOf("email not confirmed")>-1)return t("notconf");
if(m.indexOf("password should be at least")>-1||m.indexOf("password is too weak")>-1)return t("shortpass");
if(m.indexOf("rate limit")>-1||m.indexOf("over request limit")>-1||m.indexOf("too many requests")>-1)return t("ratelimit");
if(m.indexOf("valid email")>-1||m.indexOf("unable to validate email")>-1)return t("bademail");
return(e&&e.message)||t("err")}
function modal(h){var m=$("modal");m.innerHTML=h;m.className=h?"on":""}
function authUI(step,msg){var emf=`<input id="em" type="email" autocomplete="email" inputmode="email" placeholder="${esc(t("email"))}" value="${esc(step==1?window._em||"":"")}"${step==1?" readonly":""}>`,b;
if(step==1)b=emf+`<input id="cd" inputmode="numeric" autocomplete="one-time-code" placeholder="${esc(t("code"))}"><button class="btn pri" data-a="verify">${t("verify")}</button><hr><button class="btn" data-a="mode0">${t("usepass")}</button>`;
else if(step==2)b=emf+`<button class="btn pri" data-a="send">${t("send")}</button><hr><button class="btn" data-a="mode0">${t("usepass")}</button>`;
else b=`<button class="btn" data-prov="google">${GLOGO}${t("goog")}</button><hr><div class="note">${t("orw")}</div>`+emf+`<input id="pw" type="password" autocomplete="current-password" placeholder="${esc(t("pass"))}"><button class="btn pri" data-a="signin">${t("login")}</button><button class="btn" data-a="signup">${t("signup")}</button><hr><button class="btn" data-a="mode2">${t("usecode")}</button>`;
modal(`<div class="dlg"><h3>${t("signin")}</h3>${SUPA_URL?"":`<p class="note">${t("setup")}</p>`}${b}<p class="note" id="am">${esc(msg||"")}</p></div>`)}
function login(tok,u){if(!u||!u.email||!(u.email_confirmed_at||u.confirmed_at))throw new Error(t("needmail"));sess={email:u.email,tok:tok};ss("smd_sess",sess);modal("");head();toast(u.email)}

su("/user",null,{Authorization:"Bearer "+tok}).then(function(u){login(tok,u)}).catch(function(e){alert(aerr(e))}).then(route)}
