.w{max-width:1120px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}

.logo{display:flex;align-items:center;gap:10px;color:var(--tx)}
.wm{font-family:"Outfit",sans-serif;font-weight:900;font-size:26px;letter-spacing:2px;line-height:1;background:linear-gradient(90deg,#e9d5ff,#a855f7 60%,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme=light] .wm{background:linear-gradient(90deg,#7c3aed,#4c1d95);-webkit-background-clip:text;background-clip:text}
.wm small{display:block;font-size:10px;font-weight:600;letter-spacing:.3px;color:var(--mu);-webkit-text-fill-color:var(--mu);margin-top:3px}
.sp{flex:1}
.btn,select,input{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;transition:border-color .15s,background .15s}

.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:var(--on);font-weight:700}
.em{color:var(--mu);font-size:13px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:20px 0 50px;min-height:70vh}
.tabs{display:flex;gap:0;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--bd)}
.tab{padding:10px 4px;margin-right:22px;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;color:var(--mu);font-weight:600;border-radius:0}
.tab.on{border-bottom-color:var(--ac);color:var(--tx)}
.tools{display:grid;grid-template-columns:1fr repeat(3,auto);gap:8px;margin-bottom:16px}

.card{display:flex;flex-direction:column;gap:12px;background:var(--sf);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:16px;padding:16px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;box-shadow:var(--shadow)}
.card:hover{border-color:var(--ac);transform:translateY(-3px)}
.ic{position:relative;width:76px;height:76px;flex:none;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--sf2),var(--bd));display:grid;place-items:center;font-family:"Outfit",sans-serif;font-weight:800;font-size:28px;color:var(--ac2)}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--sf2)}
.in{flex:1;min-width:0}.in h3{margin:0;font-size:17px}.in h3 small{font-weight:400;color:var(--mu);font-size:13px}

.heart{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:4px 10px;cursor:pointer;color:var(--mu)}
.heart.on{color:#f43f5e;border-color:#f43f5e}.heart.big{padding:10px 14px;font-size:16px}
.msg{text-align:center;color:var(--mu);padding:40px}.mid{text-align:center;margin-top:14px}
.ttl{margin:0 0 14px}
